#!/usr/sbin/nft -f
# CVE-2026-98432 (IPv4 の inet_opt / ireq_opt の use-after-free) の暫定策。IP オプション付きの TCP を入口で捨てる。
# https://access.redhat.com/security/vulnerabilities/RHSB-2026-016
# 修正は upstream 6.18.56。WSL の同梱カーネルがそれ以上になったら、この表ごと消す。
#
# Docker Desktop はこの distro とは別の netns なので、ここに書いても devcontainer は守れない (homelab/nft-guard)。
# flush ruleset はしない。自分の表だけを作り直すので、何度 load しても同じになる。
table inet cve_2026_98432
delete table inet cve_2026_98432
table inet cve_2026_98432 {
	chain input {
		type filter hook input priority -310; policy accept;
		ip protocol tcp ip hdrlength > 5 counter drop
	}
}
