---
# Ubuntu 26.04 on WSL 3.x.
# 開発の実体は Docker Desktop 上の devcontainer にあり (CUDA もコンテナ側で pip の nvidia-* を使う)、
# distro 本体には devcontainer の bind 元・ssh・zsh・Linuxbrew だけを置く。
# GTK/WebKit (tauri)・colmap・portaudio・deadsnakes・CUDA toolkit・oibaf は 22.04 時代の個人プロジェクト用で、
# 26.04 移行 (2026-10) で外した。/mnt/wsl の umount 伝播対策 (wsl-mnt-guard) は WSL 3.0 が generator で入れる。

# https://learn.microsoft.com/ja-jp/windows/wsl/wsl-config
# After copying wsl.conf, you need to restart WSL.
- name: Copy wsl.conf
  ansible.builtin.copy:
    src: etc/wsl.conf
    dest: /etc/wsl.conf
    owner: root
    group: root
    mode: '0644'
  become: true

# openssh-server の postinst が ssh.socket を起動する前に置く。既定の Port 22 は mirrored networking では
# Windows の sshd が持っていて、ssh.socket が "Address already in use" で落ち、dpkg ごと失敗する。
# --force-confold なので、先に置いた設定はパッケージに上書きされない。
- name: Ensure /etc/ssh exists
  ansible.builtin.file:
    path: /etc/ssh
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Copy sshd_config
  ansible.builtin.copy:
    src: etc/ssh/sshd_config
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0644'
  register: sshd_config
  become: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - zsh
      # Linuxbrew の前提 (https://docs.brew.sh/Homebrew-on-Linux#requirements)
      - build-essential
      - procps
      - curl
      - file
      - git
      - git-lfs
      - openssh-server
      - ncdu
    state: present
    update_cache: true
  become: true

- name: Set shell for user
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: /usr/bin/zsh
  become: true

- name: Generate SSH host keys
  ansible.builtin.command: ssh-keygen -A
  args:
    creates: /etc/ssh/ssh_host_ed25519_key
  become: true

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "~/.ssh"
    state: directory
    mode: '0700'

- name: Fetch GitHub public keys
  ansible.builtin.uri:
    url: "{{ github_keys_url }}"
    return_content: true
  register: github_keys

- name: Set authorized_keys with GitHub keys only
  ansible.builtin.copy:
    content: "{{ github_keys.content }}"
    dest: "~/.ssh/authorized_keys"
    mode: '0600'

# 24.04 以降の sshd は socket 起動で、listen するポートは sshd-socket-generator が sshd_config の Port から作る。
# 設定を変えたら daemon-reload してから ssh.socket を張り直す。
- name: Enable and start openssh-server (socket activation)
  ansible.builtin.systemd:
    name: ssh.socket
    state: "{{ 'restarted' if sshd_config is changed else 'started' }}"
    enabled: true
    daemon_reload: true
  become: true

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
  become: true

# インストーラは /home/linuxbrew を作るときだけ sudo を呼び、NONINTERACTIVE ではパスワードを聞けずに落ちる。
# 先に作って所有者を渡しておけば sudo を呼ばない。
- name: Prepare Linuxbrew prefix
  ansible.builtin.file:
    path: /home/linuxbrew/.linuxbrew
    state: directory
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
    mode: '0755'
  become: true

- name: Install Linuxbrew
  ansible.builtin.shell: >-
    NONINTERACTIVE=1 /bin/bash -c
    "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  args:
    creates: /home/linuxbrew/.linuxbrew/bin/brew

# brew の cask (claude-code) は Claude Code の自動更新が効かず、22.04 では 2.1.31 のまま 8 か月止まっていた。
# ネイティブインストーラは ~/.local/bin/claude に入り、以後は自分で更新する (PATH は dotfiles の .path)。
- name: Install Claude Code (native installer)
  ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/claude"

- name: Install from Brewfile
  ansible.builtin.command: /home/linuxbrew/.linuxbrew/bin/brew bundle --file={{ item }}
  with_items:
    - "{{ homebrew_brewfile_dir }}/Brewfile"
  changed_when: false
